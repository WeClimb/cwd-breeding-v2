# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd cwd-breeding && npm ci # Installs dependencies
      - run: cd cwd-breeding && npm run build # Builds the project
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CWD_BREEDING }}
          channelId: live
          projectId: cwd-breeding
          entryPoint: ./cwd-breeding
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
