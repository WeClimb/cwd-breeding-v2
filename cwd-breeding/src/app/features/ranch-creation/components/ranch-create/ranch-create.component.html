<div class="ranch-register-form-container">
    <form [formGroup]="ranchForm" (ngSubmit)="onSubmit()">
      <h1 class="header-title">Register Ranch</h1>
  
      <!-- Name Input -->
      <mat-form-field appearance="outline">
        <mat-label>Ranch Name</mat-label>
        <input matInput formControlName="name" required>
        <mat-error *ngIf="ranchForm.controls.name.invalid">Ranch Name is required</mat-error>
      </mat-form-field>
  
      <!-- Owner Name Input -->
      <mat-form-field appearance="outline">
        <mat-label>Owner Name</mat-label>
        <input matInput formControlName="ownerName" required>
        <mat-error *ngIf="ranchForm.controls.ownerName.invalid">Owner Name is required</mat-error>
      </mat-form-field>
  
      <!-- Website Input -->
      <mat-form-field appearance="outline">
        <mat-label>Website</mat-label>
        <input matInput formControlName="website">
      </mat-form-field>
  
      <!-- Address Input -->
      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" required>
        <mat-error *ngIf="ranchForm.controls.address.invalid">Address is required</mat-error>
      </mat-form-field>
  
      <!-- City Input -->
      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" required>
        <mat-error *ngIf="ranchForm.controls.city.invalid">City is required</mat-error>
      </mat-form-field>
  
      <!-- State Input -->
      <mat-form-field appearance="outline">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" required>
        <mat-error *ngIf="ranchForm.controls.state.invalid">State is required</mat-error>
      </mat-form-field>
  
      <!-- Zipcode Input -->
      <mat-form-field appearance="outline">
        <mat-label>Zipcode</mat-label>
        <input matInput formControlName="zipcode" required>
        <mat-error *ngIf="ranchForm.controls.zipcode.invalid">Zipcode is required</mat-error>
      </mat-form-field>
  
      <!-- Phone Number Input -->
      <mat-form-field appearance="outline">
        <mat-label>Phone Number</mat-label>
        <input matInput formControlName="phoneNumber" required>
        <mat-error *ngIf="ranchForm.controls.phoneNumber.invalid">Phone number is required</mat-error>
      </mat-form-field>
  
      <!-- Email Input -->
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" required type="email">
        <mat-error *ngIf="ranchForm.controls.email.invalid">Please enter a valid email</mat-error>
      </mat-form-field>
  
      <!-- Submit Button -->
      <button mat-raised-button color="primary" type="submit" [disabled]="ranchForm.invalid">
        Submit
      </button>
    </form>
  </div>
