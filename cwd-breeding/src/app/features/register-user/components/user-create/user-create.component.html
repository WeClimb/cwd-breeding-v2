<div class="user-register-form-container">
  <form [formGroup]="userCreateForm" (ngSubmit)="onSubmit()">
    <h1 class="header-title">Create an Account</h1>
    <!-- Name Input -->
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="userCreateForm.controls.name.invalid">Name is required</mat-error>
    </mat-form-field>

    <!-- Email Input -->
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required type="email">
      <mat-error *ngIf="userCreateForm.controls.email.invalid">Please enter a valid email</mat-error>
    </mat-form-field>

    <!-- Password Input -->
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" required type="password">
      <mat-error *ngIf="userCreateForm.controls.password.invalid">
        Password must be at least 6 characters
      </mat-error>
    </mat-form-field>

    <!-- Phone Number Input -->
    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" type="tel" appPhoneMask>
    </mat-form-field>

    <!-- Submit Button -->
    <button mat-raised-button color="primary" type="submit" [disabled]="userCreateForm.invalid">
      Submit
    </button>

    <div *ngIf="showGoogleSignIn" class="divider">
      <span>OR</span>
      <button mat-stroked-button color="warn" class="google-button" (click)="onGoogleSignIn()">
        <div class="google-btn-label-container">
          <img *ngIf="googleIconUrl"  [src]="googleIconUrl"  alt="Google Icon">
          <p>Sign Up with Google</p>
        </div>
      </button>
    </div>
  </form>
</div>
